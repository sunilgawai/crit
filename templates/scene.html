<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* The scene canvas is SCENE.width/scale × SCENE.height/scale CSS px (540×960 here). */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--world); }
  .device {
    position: absolute; left: 50%; top: 50%; width: 402px; height: 874px;
    transform: translate(-50%, -50%) scale(.92); border-radius: 56px; overflow: hidden;
    box-shadow: 0 0 0 9px #111, 0 40px 80px rgba(0,0,0,.25);
  }
  .device iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Animate only with CSS animations or WAAPI created at load — capture.mjs seeks them frame by frame. */
  #b { animation: push 450ms var(--ease-out) 1600ms both; }
  @keyframes push { from { transform: translateX(100%); } to { transform: translateX(0); } }
</style>
</head>
<body>
<div class="device">
  <iframe id="a" src="../screens/ios/01-home.html"></iframe>
  <iframe id="b" src="../screens/ios/02-detail.html"></iframe>
</div>
<script>
  window.SCENE = { duration: 4000, fps: 30, width: 1080, height: 1920, scale: 2 };
</script>
</body>
</html>
