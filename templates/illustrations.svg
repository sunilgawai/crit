<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- This file is XML: never write two hyphens in a row inside a comment (so don't name CSS
       variables here). One stray double hyphen makes the whole file invalid and every symbol renders
       blank; scan.mjs reports it as broken-illustration.
       The app's illustration kit. One <symbol> per reusable drawing (mascot poses, motifs, icons).
       Use from a screen with: <svg width="120" height="120"><use href="../../illustrations.svg#mascot-wave"/></svg> -->
</svg>
