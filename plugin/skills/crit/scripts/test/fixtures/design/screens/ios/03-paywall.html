<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../device.css">
<style>
  body { background:#F3EEE4; color:#1C1A17; font-family: system-ui, BlinkMacSystemFont, sans-serif; }
  .close { position:absolute; top:58px; right:16px; width:44px; height:44px; border:0; border-radius:22px; background:#E6DFD2; color:#1C1A17; font-size:20px; }
  main { padding: 120px 24px 0; }
  h1 { font: 700 34px/1.1 Georgia, serif; margin:0 0 24px; }
  .price { font: 700 28px Georgia, serif; margin: 0; }
  .weekly, .trial, .after { font-size:15px; color:#4A453E; margin: 6px 0; }
  .cta { display:block; width:100%; height:56px; margin-top:24px; border:0; border-radius:28px; background:#E8501A; color:#1C1A17; font:600 17px system-ui; }
  nav { display:flex; justify-content:space-between; margin-top:12px; }
  nav a { display:inline-flex; align-items:center; min-height:44px; min-width:44px; font-size:13px; color:#4A453E; }
</style></head>
<body data-platform="ios" data-screen-kind="paywall">
<button class="close" data-paywall="close" aria-label="Close">×</button>
<main>
  <h1>Every bill, settled by Sunday.</h1>
  <p class="price" data-paywall="price">€29.99 a year</p>
  <p class="weekly">That's €0.58 a week.</p>
  <p class="trial" data-paywall="trial">Free for 7 days.</p>
  <p class="after" data-paywall="after-trial">Then €29.99 a year. Cancel anytime in Settings.</p>
  <button class="cta">Start my free week</button>
  <nav><a data-paywall="restore">Restore</a><a data-paywall="terms">Terms</a><a data-paywall="privacy">Privacy</a></nav>
</main>
<script src="../../device.js"></script></body></html>
